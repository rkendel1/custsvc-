services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: knowledgeos-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080
      HOST: 0.0.0.0
      COMPANY_NAME: KnowledgeOS
      DATABASE_URL: postgres://knowledgeos:knowledgeos@postgres:5432/knowledgeos?sslmode=disable
      PGSSLMODE: disable
      PG_LIFECYCLE_BACKEND: "true"
      PG_REQUIRE_ON_STARTUP: "false"
      PG_ALLOW_JSON_FALLBACK: "true"
      SOURCE_SECRET_KEY: local-dev-source-secret-change-me
      SOURCE_SECRET_KEY_VERSION: 1
      APP_PASSWORD: localdev
      APP_AUTH_SECRET: local-dev-auth-secret-change-me
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
    ports:
      - "${APP_PORT:-3000}:8080"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
      - app_data:/app/data
      - app_bundles:/app/bundles
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: knowledgeos-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgeos
      POSTGRES_USER: knowledgeos
      POSTGRES_PASSWORD: knowledgeos
    ports:
      - "${PG_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeos -d knowledgeos"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: knowledgeos-adminer-dev
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  app_node_modules:
  app_data:
  app_bundles:
  postgres_data:
