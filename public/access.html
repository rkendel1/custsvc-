<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeOS Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1d1f2b;
        --muted: #5f667d;
        --panel: #ffffff;
        --line: #dbe2f1;
        --brand: #1254ff;
        --canvas: #f6f8fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        font-family: 'Manrope', sans-serif;
        background:
          radial-gradient(1000px 460px at 10% -8%, #fff0d4 0%, transparent 60%),
          radial-gradient(860px 470px at 88% -10%, #dbeafe 0%, transparent 62%),
          var(--canvas);
      }

      .card {
        width: min(460px, 92vw);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 1.1rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        text-decoration: none;
        color: var(--ink);
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .brand strong {
        font-family: 'Sora', sans-serif;
        font-size: 1.15rem;
      }

      .brand span { color: var(--brand); }

      h1 {
        margin: 0.8rem 0 0.35rem;
        font-family: 'Sora', sans-serif;
        font-size: 1.45rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      label {
        display: block;
        margin-top: 0.7rem;
        font-weight: 700;
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.62rem 0.65rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        font: inherit;
      }

      button {
        margin-top: 0.8rem;
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 0.64rem 1rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #1254ff, #2f88ff);
        cursor: pointer;
      }

      .status {
        margin-top: 0.65rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f4f7ff;
        padding: 0.62rem;
        color: #33436b;
        font-size: 0.9rem;
      }

      .section {
        margin-top: 0.9rem;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }

      .section h2 {
        margin: 0 0 0.3rem;
        font-family: 'Sora', sans-serif;
        font-size: 1rem;
      }

      .actions {
        margin-top: 0.55rem;
        display: flex;
        gap: 0.45rem;
      }

      .btn-ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <section class="card">
      <a class="brand" href="/">
        <img src="/koslogo.svg" alt="KnowledgeOS logo" />
        <strong>Knowledge<span>OS</span></strong>
      </a>
      <h1>Protected area</h1>
      <p>Enter your workspace password to continue.</p>

      <form id="accessForm">
        <label>Password
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Unlock</button>
      </form>
      <div class="actions">
        <button id="continueBtn" type="button" class="btn-ghost">Continue</button>
        <button id="logoutBtn" type="button" class="btn-ghost">Sign out</button>
      </div>

      <section class="section">
        <h2>Set or change password</h2>
        <p id="passwordHelp">Create your own workspace password for protected pages.</p>
        <form id="passwordForm">
          <label>Current password (required when changing)
            <input id="currentPassword" type="password" autocomplete="current-password" />
          </label>
          <label>New password
            <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <label>Confirm new password
            <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <button type="submit">Save password</button>
        </form>
      </section>
      <div id="status" class="status">Waiting for password.</div>
    </section>

    <script>
      const form = document.getElementById('accessForm');
      const passwordInput = document.getElementById('password');
      const passwordForm = document.getElementById('passwordForm');
      const currentPasswordInput = document.getElementById('currentPassword');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordHelp = document.getElementById('passwordHelp');
      const continueBtn = document.getElementById('continueBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const status = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next') || '/admin';

      function setStatus(message) {
        status.textContent = String(message || '');
      }

      async function getAccessStatus() {
        const response = await fetch('/api/access/status');
        const text = await response.text();
        return text ? JSON.parse(text) : {};
      }

      async function refreshStatus() {
        try {
          const state = await getAccessStatus();
          if (!state.password_required) {
            passwordHelp.textContent = 'No password is set yet. Create one to protect company pages.';
            setStatus('You are currently logged in because password protection is not enabled yet.');
            return;
          }
          if (state.authenticated) {
            passwordHelp.textContent = 'You are signed in. You can change your password below.';
            setStatus('You are logged in.');
          } else {
            passwordHelp.textContent = 'Sign in to continue. If you know the current password, you can also change it below.';
            setStatus('You are logged out.');
          }
        } catch (_error) {
          setStatus('Could not check access state.');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        setStatus('Checking password...');

        const response = await fetch('/api/access/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });

        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch (_error) { body = {}; }

        if (!response.ok) {
          setStatus(body.error || 'Access denied.');
          return;
        }

        setStatus('Access granted.');
        await refreshStatus();
      });

      passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const currentPassword = currentPasswordInput.value;
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword || newPassword.length < 8) {
          setStatus('New password must be at least 8 characters.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setStatus('New password and confirmation do not match.');
          return;
        }

        setStatus('Saving password...');

        const response = await fetch('/api/access/password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
          }),
        });

        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch (_error) { body = {}; }

        if (!response.ok) {
          setStatus(body.error || 'Could not update password.');
          return;
        }

        currentPasswordInput.value = '';
        newPasswordInput.value = '';
        confirmPasswordInput.value = '';
        setStatus('Password updated. You are logged in.');
        await refreshStatus();
      });

      continueBtn.addEventListener('click', () => {
        window.location.href = next;
      });

      logoutBtn.addEventListener('click', async () => {
        await fetch('/api/access/logout', { method: 'POST' });
        setStatus('Signed out.');
        await refreshStatus();
      });

      refreshStatus();
    </script>
  </body>
</html>
