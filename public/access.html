<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeOS Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1d1f2b;
        --muted: #5f667d;
        --panel: #ffffff;
        --line: #dbe2f1;
        --brand: #1254ff;
        --canvas: #f6f8fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        font-family: 'Manrope', sans-serif;
        background:
          radial-gradient(1000px 460px at 10% -8%, #fff0d4 0%, transparent 60%),
          radial-gradient(860px 470px at 88% -10%, #dbeafe 0%, transparent 62%),
          var(--canvas);
      }

      .card {
        width: min(460px, 92vw);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 1.1rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        text-decoration: none;
        color: var(--ink);
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .brand strong {
        font-family: 'Sora', sans-serif;
        font-size: 1.15rem;
      }

      .brand span { color: var(--brand); }

      h1 {
        margin: 0.8rem 0 0.35rem;
        font-family: 'Sora', sans-serif;
        font-size: 1.45rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      label {
        display: block;
        margin-top: 0.7rem;
        font-weight: 700;
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.62rem 0.65rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        font: inherit;
      }

      button {
        margin-top: 0.8rem;
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 0.64rem 1rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #1254ff, #2f88ff);
        cursor: pointer;
      }

      .status {
        margin-top: 0.65rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f4f7ff;
        padding: 0.62rem;
        color: #33436b;
        font-size: 0.9rem;
      }

      .section {
        margin-top: 0.9rem;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }

      .section h2 {
        margin: 0 0 0.3rem;
        font-family: 'Sora', sans-serif;
        font-size: 1rem;
      }

      .auth-pane { display: none; }
      .auth-pane.active { display: block; }

      .mode-toggle {
        margin-top: 0.8rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
      }

      .mode-btn {
        margin-top: 0;
        width: 100%;
      }

      .mode-btn.inactive {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <section class="card">
      <a class="brand" href="/">
        <img src="/koslogo.svg" alt="KnowledgeOS logo" />
        <strong>Knowledge<span>OS</span></strong>
      </a>
      <h1>Sign in</h1>
      <p id="introText">Use your workspace password to continue.</p>

      <div class="mode-toggle">
        <button id="signinModeBtn" type="button" class="mode-btn">Sign in</button>
        <button id="signupModeBtn" type="button" class="mode-btn inactive">Sign up</button>
      </div>

      <section id="loginPane" class="auth-pane active">
        <form id="accessForm">
          <label>Workspace ID (your company)
            <input id="workspaceId" autocomplete="organization" placeholder="Optional" />
          </label>
          <label>Work email
            <input id="workEmail" type="email" autocomplete="email" placeholder="Optional" />
          </label>
          <label>Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Log in</button>
        </form>
      </section>

      <section id="signupPane" class="auth-pane">
        <section class="section" style="margin-top:0.75rem; border-top:none; padding-top:0;">
          <h2>Create account</h2>
          <p id="passwordHelp">Use your workspace ID (your company), work email, and password to create your account.</p>
          <form id="passwordForm">
            <label>Workspace ID (your company)
              <input id="signupWorkspaceId" autocomplete="organization" required />
            </label>
            <label>Work email
              <input id="signupWorkEmail" type="email" autocomplete="email" required />
            </label>
            <label>New password
              <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
            </label>
            <label>Confirm new password
              <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
            </label>
            <button type="submit">Create account</button>
          </form>
        </section>
      </section>

      <div id="status" class="status">Checking sign-in requirements...</div>
    </section>

    <script>
      const form = document.getElementById('accessForm');
      const workspaceIdInput = document.getElementById('workspaceId');
      const workEmailInput = document.getElementById('workEmail');
      const passwordInput = document.getElementById('password');
      const passwordForm = document.getElementById('passwordForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const signupWorkspaceIdInput = document.getElementById('signupWorkspaceId');
      const signupWorkEmailInput = document.getElementById('signupWorkEmail');
      const passwordHelp = document.getElementById('passwordHelp');
      const introText = document.getElementById('introText');
      const status = document.getElementById('status');
      const signinModeBtn = document.getElementById('signinModeBtn');
      const signupModeBtn = document.getElementById('signupModeBtn');
      const loginPane = document.getElementById('loginPane');
      const signupPane = document.getElementById('signupPane');
      const params = new URLSearchParams(window.location.search);
      const requestedNext = String(params.get('next') || '').trim();

      function setStatus(message) {
        status.textContent = String(message || '');
      }

      function setMode(mode) {
        const signupMode = mode === 'signup';
        loginPane.classList.toggle('active', !signupMode);
        signupPane.classList.toggle('active', signupMode);
        signinModeBtn.classList.toggle('inactive', signupMode);
        signupModeBtn.classList.toggle('inactive', !signupMode);
        introText.textContent = signupMode
          ? 'Create your workspace account to continue.'
          : 'Use your workspace credentials to sign in.';
      }

      function sanitizeRequestedNext(value) {
        const candidate = String(value || '').trim();
        if (!candidate || candidate === '/') return '';
        if (!candidate.startsWith('/')) return '';
        if (candidate.startsWith('//')) return '';
        if (candidate.startsWith('/access.html')) return '';
        return candidate;
      }

      function resolveRedirectUrl(serverNextUrl, fallback) {
        const serverNext = String(serverNextUrl || '').trim();
        if (serverNext.startsWith('/') && !serverNext.startsWith('//')) return serverNext;
        const requested = sanitizeRequestedNext(requestedNext);
        if (requested) return requested;
        return fallback;
      }

      async function getAccessStatus() {
        const response = await fetch('/api/access/status');
        const text = await response.text();
        return text ? JSON.parse(text) : {};
      }

      async function refreshStatus() {
        try {
          const state = await getAccessStatus();
          const authenticatedTenantId = String(state?.authenticated_tenant_id || '').trim().toLowerCase();
          if (authenticatedTenantId) {
            localStorage.setItem('knowledgeos_active_tenant_id', authenticatedTenantId);
          }
          if (state.signup_required) {
            introText.textContent = 'Create your workspace account to continue.';
            passwordHelp.textContent = 'Use your workspace ID, work email, and password to create your account.';
            setMode('signup');
            setStatus('Create your account to continue.');
            return;
          }

          if (state.authenticated) {
            setStatus('You are already logged in. Redirecting...');
            window.location.href = resolveRedirectUrl(state?.next_url, '/admin.html');
            return;
          }

          if (state.auth_mode === 'credentials') {
            setMode('login');
            setStatus('Enter your credentials to sign in.');
            return;
          }

          if (!state.password_required) {
            introText.textContent = 'Create your workspace account to continue.';
            setMode('signup');
            setStatus('Create your account to continue.');
            return;
          }
          setMode('login');
          setStatus('Enter your credentials to sign in.');
        } catch (_error) {
          setStatus('Could not check access state.');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        setStatus('Signing in...');

        const workspaceId = String(workspaceIdInput.value || '').trim();
        const workEmail = String(workEmailInput.value || '').trim().toLowerCase();
        if (!workspaceId || !workEmail) {
          setStatus('Workspace ID and work email are required.');
          return;
        }
        if (workEmail) localStorage.setItem('knowledgeos_last_email', workEmail);
        if (workspaceId) localStorage.setItem('knowledgeos_last_workspace', workspaceId);
        if (workspaceId) localStorage.setItem('knowledgeos_active_tenant_id', workspaceId.toLowerCase());

        const response = await fetch('/api/access/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            password: passwordInput.value,
            email: workEmail || undefined,
            tenant_id: workspaceId || undefined,
          }),
        });

        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch (_error) { body = {}; }

        if (!response.ok) {
          setStatus(body.error || 'Access denied.');
          return;
        }

        setStatus('Access granted.');
        await refreshStatus();
        window.location.href = resolveRedirectUrl(body?.next_url, '/admin.html');
      });

      passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const signupWorkspaceId = String(signupWorkspaceIdInput.value || '').trim();
        const signupWorkEmail = String(signupWorkEmailInput.value || '').trim().toLowerCase();

        if (!signupWorkspaceId || !signupWorkEmail) {
          setStatus('Workspace ID and work email are required.');
          return;
        }

        if (!newPassword || newPassword.length < 8) {
          setStatus('New password must be at least 8 characters.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setStatus('New password and confirmation do not match.');
          return;
        }

        setStatus('Creating account...');

        const response = await fetch('/api/access/signup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            tenant_id: signupWorkspaceId,
            email: signupWorkEmail,
            password: newPassword,
          }),
        });

        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch (_error) { body = {}; }

        if (!response.ok) {
          setStatus(body.error || 'Could not update password.');
          return;
        }

        newPasswordInput.value = '';
        confirmPasswordInput.value = '';
        signupWorkspaceIdInput.value = signupWorkspaceId;
        signupWorkEmailInput.value = signupWorkEmail;
        workspaceIdInput.value = signupWorkspaceId;
        workEmailInput.value = signupWorkEmail;
        localStorage.setItem('knowledgeos_last_email', signupWorkEmail);
        localStorage.setItem('knowledgeos_last_workspace', signupWorkspaceId);
        localStorage.setItem('knowledgeos_active_tenant_id', signupWorkspaceId.toLowerCase());
        setStatus('Account created. You are signed in.');
        await refreshStatus();
        window.location.href = String(body?.next_url || `/onboarding.html?tenant_id=${encodeURIComponent(signupWorkspaceId.toLowerCase())}`);
      });

      {
        const savedEmail = localStorage.getItem('knowledgeos_last_email') || '';
        const savedWorkspace = localStorage.getItem('knowledgeos_last_workspace') || '';
        if (workEmailInput && savedEmail) workEmailInput.value = savedEmail;
        if (workspaceIdInput && savedWorkspace) workspaceIdInput.value = savedWorkspace;
        if (signupWorkEmailInput && savedEmail) signupWorkEmailInput.value = savedEmail;
        if (signupWorkspaceIdInput && savedWorkspace) signupWorkspaceIdInput.value = savedWorkspace;
      }

      signinModeBtn.addEventListener('click', () => setMode('login'));
      signupModeBtn.addEventListener('click', () => setMode('signup'));

      refreshStatus();
    </script>
  </body>
</html>
