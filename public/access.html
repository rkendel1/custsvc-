<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeOS Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1d1f2b;
        --muted: #5f667d;
        --panel: #ffffff;
        --line: #dbe2f1;
        --brand: #1254ff;
        --canvas: #f6f8fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        font-family: 'Manrope', sans-serif;
        background:
          radial-gradient(1000px 460px at 10% -8%, #fff0d4 0%, transparent 60%),
          radial-gradient(860px 470px at 88% -10%, #dbeafe 0%, transparent 62%),
          var(--canvas);
      }

      .card {
        width: min(460px, 92vw);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 1.1rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        text-decoration: none;
        color: var(--ink);
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .brand strong {
        font-family: 'Sora', sans-serif;
        font-size: 1.15rem;
      }

      .brand span { color: var(--brand); }

      h1 {
        margin: 0.8rem 0 0.35rem;
        font-family: 'Sora', sans-serif;
        font-size: 1.45rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      label {
        display: block;
        margin-top: 0.7rem;
        font-weight: 700;
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.62rem 0.65rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        font: inherit;
      }

      button {
        margin-top: 0.8rem;
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 0.64rem 1rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #1254ff, #2f88ff);
        cursor: pointer;
      }

      .status {
        margin-top: 0.65rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f4f7ff;
        padding: 0.62rem;
        color: #33436b;
        font-size: 0.9rem;
      }

      .section {
        margin-top: 0.9rem;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }

      .section h2 {
        margin: 0 0 0.3rem;
        font-family: 'Sora', sans-serif;
        font-size: 1rem;
      }

      .auth-pane { display: none; }
      .auth-pane.active { display: block; }
    </style>
  </head>
  <body>
    <section class="card">
      <a class="brand" href="/">
        <img src="/koslogo.svg" alt="KnowledgeOS logo" />
        <strong>Knowledge<span>OS</span></strong>
      </a>
      <h1>Sign in</h1>
      <p id="introText">Use your workspace password to continue.</p>

      <section id="loginPane" class="auth-pane active">
        <form id="accessForm">
          <label>Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Log in</button>
        </form>
      </section>

      <section id="signupPane" class="auth-pane">
        <section class="section" style="margin-top:0.75rem; border-top:none; padding-top:0;">
          <h2>Create password</h2>
          <p id="passwordHelp">Create your workspace password. You will use this password to access protected pages.</p>
          <form id="passwordForm">
            <label>New password
              <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
            </label>
            <label>Confirm new password
              <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
            </label>
            <button type="submit">Create password</button>
          </form>
        </section>
      </section>

      <div id="status" class="status">Checking sign-in requirements...</div>
    </section>

    <script>
      const form = document.getElementById('accessForm');
      const passwordInput = document.getElementById('password');
      const passwordForm = document.getElementById('passwordForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordHelp = document.getElementById('passwordHelp');
      const introText = document.getElementById('introText');
      const status = document.getElementById('status');
      const loginPane = document.getElementById('loginPane');
      const signupPane = document.getElementById('signupPane');
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next') || '/admin';

      function setStatus(message) {
        status.textContent = String(message || '');
      }

      function setMode(mode) {
        const signupMode = mode === 'signup';
        loginPane.classList.toggle('active', !signupMode);
        signupPane.classList.toggle('active', signupMode);
      }

      async function getAccessStatus() {
        const response = await fetch('/api/access/status');
        const text = await response.text();
        return text ? JSON.parse(text) : {};
      }

      async function refreshStatus() {
        try {
          const state = await getAccessStatus();
          if (!state.password_required) {
            introText.textContent = 'Create a workspace password to get started.';
            setMode('signup');
            setStatus('Create your password to continue.');
            return;
          }
          if (state.authenticated) {
            setStatus('You are already logged in. Redirecting...');
            window.location.href = next;
          } else {
            introText.textContent = 'Sign in with your workspace password to continue.';
            setMode('login');
            setStatus('You are logged out.');
          }
        } catch (_error) {
          setStatus('Could not check access state.');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        setStatus('Checking password...');

        const response = await fetch('/api/access/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });

        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch (_error) { body = {}; }

        if (!response.ok) {
          setStatus(body.error || 'Access denied.');
          return;
        }

        setStatus('Access granted.');
        await refreshStatus();
        window.location.href = next;
      });

      passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword || newPassword.length < 8) {
          setStatus('New password must be at least 8 characters.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setStatus('New password and confirmation do not match.');
          return;
        }

        setStatus('Saving password...');

        const response = await fetch('/api/access/password', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            new_password: newPassword,
          }),
        });

        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch (_error) { body = {}; }

        if (!response.ok) {
          setStatus(body.error || 'Could not update password.');
          return;
        }

        newPasswordInput.value = '';
        confirmPasswordInput.value = '';
        setStatus('Password updated. You are logged in.');
        await refreshStatus();
        window.location.href = next;
      });

      refreshStatus();
    </script>
  </body>
</html>
